<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>השקעות חכמות - בקרוב</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./item.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main id="apartments-page">
        <!-- 🎬 נגן הוידאו של COMING SOON -->
        <div class="coming-soon-wrapper">
            <video autoplay loop muted playsinline>
                <source src="./comingsoon.mp4" type="video/mp4">
                הדפדפן שלך אינו תומך בניגון וידאו.
            </video>
        </div>
    </main>

    <script type="module" src="./header.js"></script>
    <script type="module" src="./item.js"></script>

    <script>
        document.body.classList.add('scrolled-to-search');
        window.addEventListener('scroll', (e) => {
            if (!document.body.classList.contains('scrolled-to-search')) {
                document.body.classList.add('scrolled-to-search');
            }
        }, true);
    </script>
</body>
</html>
