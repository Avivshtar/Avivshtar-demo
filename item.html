<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>השקעות חכמות - פרטי נכס</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./item.css">
    <link rel="stylesheet" href="./similar-properties.css">
    <link rel="stylesheet" href="./contact-module.css">
    
    <!-- 🔮 סגנונות המודאל המורחב של התוכנית העסקית -->
    <link rel="stylesheet" href="./plan-modal.css">
</head>
<body>

    <!-- הסרגל העליון -->
    <div id="header-placeholder"></div>

    <!-- התוכן המרכזי -->
    <main id="item-page-container">
        
        <!-- 🏔️ אזור ההירו העליון -->
        <div class="property-hero-wrapper">
            
            <!-- 🍏 כפתור חזרה GLASS (מימין) -->
            <button class="back-btn-glass glass-action-btn" id="back-page-btn" onclick="history.back()" aria-label="חזרה לדף הקודם">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

            <!-- 🍏 כפתור שיתוף GLASS (משמאל) -->
            <button class="glass-action-btn share-btn-glass" id="share-btn" onclick="this.classList.toggle('active-share')" aria-label="שיתוף">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
            </button>

            <!-- 🍏 כפתור לב GLASS (משמאל) -->
            <button class="glass-action-btn love-btn-glass" id="love-btn" onclick="this.classList.toggle('active-love')" aria-label="הוספה למועדפים">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            </button>

            <!-- 🤍 המעטפת העליונה (סליידר + קוביות) -->
            <div class="top-white-overlay-card">
                <div class="thumbnails-grid" id="thumbnails-grid"></div>

                <div class="main-gallery-container" id="main-gallery-container">
                    <button class="gallery-nav-btn prev-btn" id="gallery-prev-btn" aria-label="תמונה הקודמת">&#10094;</button>
                    <button class="gallery-nav-btn next-btn" id="gallery-next-btn" aria-label="תמונה הבאה">&#10095;</button>
                    <div class="gallery-slider" id="gallery-slider"></div>
                    <div class="gallery-dots" id="gallery-dots"></div>
                </div>
            </div>

        </div>

        <!-- 📄 דף לבן נקי מתחת לתמונות -->
        <div class="main-white-page-content" id="main-white-page-content"></div>

        <!-- 🔻 פוטר תנאי שימוש וזכויות יוצרים 🔻 -->
        <div id="new-shortcuts-container-3"></div>

    </main>

    <!-- 📱 סרגל יצירת קשר GLASS מרחף בתחתית המסך (מובייל וטאבלט) -->
    <div class="mobile-search-launcher" id="mobile-contact-launcher">
        <div class="launcher-box">
            <button type="button" class="launcher-action-btn btn-call-action js-mobile-call">
                <svg class="icon-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
                <span class="btn-text">התקשרו עכשיו</span>
            </button>

            <button type="button" class="launcher-action-btn btn-wa-action js-mobile-wa">
                <svg class="icon-wa" viewBox="0 0 24 24">
                    <path d="M12.004 2C6.48 2 2 6.48 2 12.004c0 1.91.48 3.71 1.39 5.32L2 22l4.83-1.27c1.55.85 3.32 1.31 5.17 1.31 5.52 0 10.004-4.48 10.004-10.004C22.008 6.48 17.524 2 12.004 2zm5.95 14.39c-.25.7-.99 1.25-1.73 1.46-.51.15-1.17.26-3.41-.73-2.86-1.27-4.66-4.15-4.81-4.34-.14-.2-1.12-1.49-1.12-2.85 0-1.36.71-2.03.96-2.31.25-.28.53-.35.71-.35.18 0 .35.01.5.02.16.01.37-.06.58.45.21.52.74 1.81.81 1.95.07.14.11.31.02.49-.09.18-.21.36-.36.53-.15.18-.32.37-.16.66.16.28.73 1.21 1.57 1.96.84.75 1.54 1.23 1.83 1.37.28.14.45.12.62-.07.17-.2.74-.86.94-1.15.2-.29.41-.24.69-.14.28.1.1.79.52 1.56 1.48.51 2.21.75 2.5.54.29-.21.29-.62.04-.92z"/>
                </svg>
                <span>WhatsApp</span>
            </button>
        </div>
    </div>

    <!-- 📜 סקריפטים בסיום הדף (מודולים מותאמי Vite) -->
    <script src="./main.js"></script> 
    <script type="module" src="./header.js"></script>
    <script type="module" src="./contact-module.js"></script>
    <script type="module" src="./item.js"></script>
    <script type="module" src="./similar-properties.js"></script>
    <script type="module" src="./shortcuts-logic-3.js"></script>
    
    <!-- 🔮 מודול המודאל המורחב של התוכנית העסקית -->
    <script type="module" src="./plan-modal.js"></script>

    <script>
        document.body.classList.add('scrolled-to-search');
        window.addEventListener('scroll', (e) => {
            if (!document.body.classList.contains('scrolled-to-search')) {
                document.body.classList.add('scrolled-to-search');
            }
        }, true);
    </script>
</body>
</html>
